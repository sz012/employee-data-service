services:
  postgres:
    image: postgres:16
    container_name: employee-data-service-db
    environment:
      POSTGRES_DB: employee_data_service
      POSTGRES_USER: employee_data_service
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: